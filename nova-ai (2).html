<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Nova — AI Voice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafaf9;--surface:#ffffff;--surface2:#f4f4f5;
  --text:#1c1917;--text2:#78716c;--text3:#a8a29e;
  --border:#e7e5e4;--border2:#d6d3d1;
  --nova:#7c3aed;--nova-light:#ede9fe;--nova-mid:#8b5cf6;
  --accent:#0ea5e9;--accent-light:#e0f2fe;
  --danger:#ef4444;--danger-light:#fee2e2;
  --success:#22c55e;--success-light:#dcfce7;
  --radius:12px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

#topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid var(--border);background:var(--surface);flex-shrink:0;z-index:10}
#topbar-left{display:flex;align-items:center;gap:10px}
#nova-logo{width:32px;height:32px;border-radius:50%;background:#cff1f4;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative;box-shadow:rgba(17,12,46,0.1) 0 8px 30px 0;animation:hueR 8s linear infinite}
.orb-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:hueRev 6s linear infinite}
.oc{position:absolute;border-radius:50%}
.orb-shine{position:absolute;inset:0;border-radius:50%;background:linear-gradient(to bottom,rgba(255,255,255,0.35) 0%,transparent 100%)}
@keyframes hueR{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes hueRev{0%{filter:blur(5px) hue-rotate(360deg)}100%{filter:blur(5px) hue-rotate(0deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes wave{0%{transform:scaleY(0.3)}50%{transform:scaleY(1)}100%{transform:scaleY(0.3)}}

#nova-name{font-size:16px;font-weight:600;letter-spacing:-0.3px;color:var(--text)}
#topbar-right{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background 0.15s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:18px;height:18px}

#brain-bar{background:var(--nova-light);border-bottom:0.5px solid #ddd6fe;padding:6px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#brain-bar svg{width:14px;height:14px;color:var(--nova);flex-shrink:0}
#brain-status{font-size:11px;color:#6d28d9;flex:1}
#brain-progress{height:3px;width:80px;background:#ddd6fe;border-radius:2px;flex-shrink:0}
#brain-fill{height:100%;border-radius:2px;background:var(--nova);transition:width 0.8s ease;width:0%}

#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.msg-user{align-self:flex-end;background:var(--nova);color:white;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:78%;font-size:14px;line-height:1.5;word-break:break-word}
.msg-user-sub{font-size:11px;opacity:0.8;margin-top:4px;font-style:italic}
.msg-ai-row{align-self:flex-start;display:flex;gap:8px;max-width:88%;align-items:flex-start}
.ai-av{width:28px;height:28px;flex-shrink:0;margin-top:2px;border-radius:50%;background:#cff1f4;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:hueR 8s linear infinite}
.ai-av .orb-inner{animation:hueRev 6s linear infinite}
.msg-ai-bubble{background:var(--surface);border:0.5px solid var(--border);border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:14px;line-height:1.6;color:var(--text);word-break:break-word}
.msg-ai-bubble strong{font-weight:500}
.msg-ai-bubble code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}
.msg-system{align-self:center;font-size:11px;color:var(--text3);background:var(--surface2);border-radius:20px;padding:4px 12px;border:0.5px solid var(--border)}

.rating-row{display:flex;gap:6px;margin-top:6px}
.rate-btn{padding:3px 8px;font-size:11px;border-radius:12px;border:0.5px solid var(--border2);background:transparent;cursor:pointer;color:var(--text2);transition:all 0.15s}
.rate-btn:hover{background:var(--surface2)}
.rate-btn.good:hover{background:var(--success-light);color:#15803d;border-color:#86efac}

.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px;text-align:center;gap:12px}
.w-title{font-size:20px;font-weight:600;color:var(--text)}
.w-sub{font-size:13px;color:var(--text2);max-width:280px;line-height:1.5}

#inputbar{background:var(--surface);border-top:0.5px solid var(--border);padding:12px 16px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;align-items:center}
#input-wrap{width:100%;background:var(--surface);border:0.5px solid var(--border2);border-radius:20px;overflow:hidden;transition:border-color 0.15s;display:flex;align-items:flex-end}
#input-wrap:focus-within{border-color:var(--nova-mid)}
#msg-input{flex:1;padding:10px 14px 4px;border:none;outline:none;background:transparent;font-size:14px;color:var(--text);resize:none;max-height:100px;overflow-y:auto;font-family:inherit;line-height:1.5}
#msg-input::placeholder{color:var(--text3)}
#bar-actions{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}
.sm-btn{width:30px;height:30px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background 0.15s}
.sm-btn:hover{background:var(--surface2)}
.sm-btn svg{width:15px;height:15px}
#send-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;overflow:hidden;margin-left:auto;display:flex;align-items:center;justify-content:center;transition:opacity 0.15s;flex-shrink:0}
#send-btn:disabled{opacity:0.4;cursor:not-allowed}

#mic-btn{width:50px;height:50px;border-radius:50%;border:none;background:var(--nova);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;box-shadow:0 4px 12px rgba(124,58,237,0.3)}
#mic-btn:hover{background:var(--nova-mid);box-shadow:0 6px 20px rgba(124,58,237,0.4)}
#mic-btn:active{transform:scale(0.95)}
#mic-btn.recording{background:var(--danger)}
#mic-btn svg{width:22px;height:22px}

.mic-mode{display:none;width:100%;flex-direction:column;gap:10px;align-items:center}
.mic-mode.active{display:flex}
.recording-indicator{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.recording-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.waveform{display:flex;align-items:center;gap:2px;height:28px;justify-content:center}
.wave-bar{width:2px;background:var(--nova);border-radius:1px;animation:wave 0.6s ease-in-out infinite}
.wave-bar:nth-child(1){animation-delay:-0.3s;height:8px}
.wave-bar:nth-child(2){animation-delay:-0.2s;height:12px}
.wave-bar:nth-child(3){height:16px}
.wave-bar:nth-child(4){animation-delay:0.2s;height:12px}
.wave-bar:nth-child(5){animation-delay:0.3s;height:8px}
.transcription-box{background:var(--surface2);border-radius:12px;padding:10px;border:0.5px solid var(--border2);font-size:12px;color:var(--text2);line-height:1.5;min-height:28px;max-width:300px;text-align:center}
.transcription-box.listening{color:var(--nova);font-weight:500}
.mic-actions{display:flex;gap:8px;justify-content:center}
.mic-action-btn{padding:6px 14px;border-radius:8px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.15s}
.mic-action-btn:hover{background:var(--surface2);color:var(--text)}
.mic-action-btn.danger{color:var(--danger);border-color:var(--danger)}

.overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:50;align-items:center;justify-content:center}
.overlay.active{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:340px;max-width:90%;border:0.5px solid var(--border2)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:12px}
.modal input{width:100%;padding:9px 12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;color:var(--text);background:var(--surface2);outline:none;font-family:inherit;margin-bottom:12px}
.modal input:focus{border-color:var(--nova-mid)}
.modal-actions{display:flex;gap:8px}
.btn-primary{flex:1;padding:9px;border-radius:var(--radius-sm);border:none;background:var(--nova);color:white;font-size:14px;font-weight:500;cursor:pointer}
.btn-primary:hover{background:var(--nova-mid)}
.btn-cancel{flex:1;padding:9px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:transparent;color:var(--text2);font-size:14px;cursor:pointer}
.btn-cancel:hover{background:var(--surface2)}

#stats-bar{display:flex;gap:16px;padding:6px 16px;border-bottom:0.5px solid var(--border);background:var(--surface);font-size:11px;color:var(--text3);flex-shrink:0}
.stat{display:flex;align-items:center;gap:4px;white-space:nowrap}
.stat-val{font-weight:500;color:var(--text2)}

#app{display:flex;flex-direction:column;height:100dvh}
</style>
</head>
<body>
<div id="app">

<div id="topbar">
  <div id="topbar-left">
    <div id="nova-logo">
      <div class="orb-inner" style="animation:hueRev 6s linear infinite">
        <div class="oc" style="width:14px;height:14px;background:#9e9fef;opacity:0.9;top:30%;left:20%"></div>
        <div class="oc" style="width:11px;height:11px;background:#c471ec;opacity:0.85;top:50%;right:20%"></div>
        <div class="oc" style="width:16px;height:16px;background:#9bc761;opacity:0.9;bottom:20%;left:30%"></div>
        <div class="oc" style="width:8px;height:8px;background:#f472b6;opacity:0.85;bottom:30%;right:25%"></div>
      </div>
      <div class="orb-shine"></div>
    </div>
    <span id="nova-name">Nova Voice</span>
  </div>
  <div id="topbar-right">
    <button class="icon-btn" onclick="showStats()" title="Stats d'apprentissage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
    </button>
    <button class="icon-btn" onclick="resetChat()" title="Nouvelle conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</div>

<div id="brain-bar">
  <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg>
  <span id="brain-status">Nova Voice prête — OpenRouter free</span>
  <div id="brain-progress"><div id="brain-fill"></div></div>
</div>

<div id="stats-bar" style="display:none">
  <div class="stat">Échanges <span class="stat-val" id="s-turns">0</span></div>
  <div class="stat">Corrections <span class="stat-val" id="s-corrections">0</span></div>
  <div class="stat">Score qualité <span class="stat-val" id="s-score">—</span></div>
  <div class="stat">Mémoire <span class="stat-val" id="s-mem">0 faits</span></div>
</div>

<div id="messages">
  <div class="welcome" id="welcome-screen">
    <div style="width:60px;height:60px;border-radius:50%;background:#cff1f4;box-shadow:rgba(17,12,46,0.12) 0 20px 60px 0;animation:hueR 8s linear infinite, float 4s ease-in-out infinite;overflow:hidden">
      <div class="orb-inner" style="animation:hueRev 6s linear infinite">
        <div class="oc" style="width:27px;height:27px;background:#9e9fef;opacity:0.9;top:15%;left:15%"></div>
        <div class="oc" style="width:21px;height:21px;background:#c471ec;opacity:0.85;top:45%;right:15%"></div>
        <div class="oc" style="width:30px;height:30px;background:#9bc761;opacity:0.9;bottom:15%;left:25%"></div>
        <div class="oc" style="width:15px;height:15px;background:#f472b6;opacity:0.85;bottom:25%;right:20%"></div>
      </div>
      <div class="orb-shine"></div>
    </div>
    <div class="w-title">Bonjour, je suis Nova Voice</div>
    <div class="w-sub">🎤 Conversations vocales naturelles avec reconnaissance vocale et réponses parlées</div>
  </div>
</div>

<div id="inputbar">
  <button id="mic-btn" onclick="toggleMic()" title="Cliquez pour parler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
  </button>
  <div class="mic-mode" id="mic-mode">
    <div class="recording-indicator">
      <div class="recording-dot"></div>
      <span id="recording-text">En écoute...</span>
    </div>
    <div class="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div class="transcription-box listening" id="transcription">Écoutez...</div>
    <div class="mic-actions">
      <button class="mic-action-btn" onclick="stopRecording()">Arrêter</button>
    </div>
  </div>
  <div id="input-wrap" style="display:none">
    <textarea id="msg-input" rows="1" placeholder="Ou tapez un message…"></textarea>
    <div id="bar-actions">
      <button class="sm-btn" title="Microphone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
      <button id="send-btn" disabled title="Envoyer">
        <div style="width:30px;height:30px;border-radius:50%;background:#cff1f4;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:hueR 8s linear infinite">
          <div class="orb-inner" style="animation:hueRev 6s linear infinite">
            <div class="oc" style="width:13px;height:13px;background:#9e9fef;opacity:0.9"></div>
            <div class="oc" style="width:10px;height:10px;background:#c471ec;opacity:0.85;top:55%;right:20%"></div>
            <div class="oc" style="width:14px;height:14px;background:#9bc761;opacity:0.9;bottom:20%"></div>
          </div>
          <div class="orb-shine"></div>
        </div>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="stats-overlay" onclick="closeStats()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" style="margin-bottom:16px">Apprentissage de Nova</div>
    <div id="stats-detail" style="font-size:13px;color:var(--text2);line-height:1.8"></div>
    <div style="margin-top:16px"><button class="btn-cancel" style="width:100%" onclick="closeStats()">Fermer</button></div>
  </div>
</div>

</div>

<script>
const msgEl = document.getElementById('messages');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const welcomeEl = document.getElementById('welcome-screen');
const brainStatus = document.getElementById('brain-status');
const brainFill = document.getElementById('brain-fill');
const micBtn = document.getElementById('mic-btn');
const micMode = document.getElementById('mic-mode');
const transcriptionBox = document.getElementById('transcription');

// Web Speech API
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

let state = {
  openrouterKey: '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',
  history: [],
  memory: [],
  corrections: 0,
  totalRatings: 0,
  goodRatings: 0,
  turns: 0,
  loading: false,
  isSpeaking: false
};

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = true;
  
  recognition.onstart = () => {
    isRecording = true;
    micMode.classList.add('active');
    micBtn.classList.add('recording');
    transcriptionBox.textContent = 'En écoute...';
    transcriptionBox.classList.add('listening');
  };
  
  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';
    
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript + ' ';
      } else {
        interimTranscript += transcript;
      }
    }
    
    const display = finalTranscript || interimTranscript || 'En écoute...';
    transcriptionBox.textContent = display;
    transcriptionBox.classList.toggle('listening', !finalTranscript);
    
    if (finalTranscript) {
      setTimeout(() => {
        recognition.stop();
      }, 500);
    }
  };
  
  recognition.onerror = (event) => {
    transcriptionBox.textContent = '❌ Erreur micro';
    transcriptionBox.classList.remove('listening');
  };
  
  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    const text = transcriptionBox.textContent.trim();
    
    if (text && text !== 'En écoute...' && text !== '❌ Erreur micro') {
      micMode.classList.remove('active');
      submitVoiceMessage(text);
    }
  };
}

function toggleMic() {
  if (isRecording) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

function stopRecording() {
  if (isRecording) {
    recognition.stop();
  }
}

function loadState() {
  try {
    const s = localStorage.getItem('nova_state');
    if (s) {
      const p = JSON.parse(s);
      state.memory = p.memory || [];
      state.corrections = p.corrections || 0;
      state.totalRatings = p.totalRatings || 0;
      state.goodRatings = p.goodRatings || 0;
    }
  } catch(e){}
  updateBrain();
}

function saveState() {
  try {
    localStorage.setItem('nova_state', JSON.stringify({
      memory: state.memory,
      corrections: state.corrections,
      totalRatings: state.totalRatings,
      goodRatings: state.goodRatings
    }));
  } catch(e){}
}

inputEl.addEventListener('input', () => {
  sendBtn.disabled = inputEl.value.trim() === '' || state.loading;
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) submitMsg(); }
});

function novaSystemPrompt() {
  const memStr = state.memory.length > 0
    ? '\n\nMÉMOIRE (faits appris) :\n' + state.memory.map(m => '- ' + m).join('\n')
    : '';
  const corrStr = state.corrections > 0
    ? `\n\nAPPRENTISSAGE : ${state.corrections} corrections, ${state.goodRatings}/${state.totalRatings} appréciées.`
    : '';
  return `Tu es Nova, une IA intelligente et bienveillante. Tu apprends de chaque conversation et mémorises les préférences et infos importantes. Reconnais tes erreurs et indique que tu as appris.

PRINCIPES :
- Réponds en français si nécessaire
- Sois concise mais complète
- Mémorise les infos pertinentes${memStr}${corrStr}`;
}

async function callOpenRouter(messages) {
  try {
    const sysMsg = { role: 'system', content: novaSystemPrompt() };
    const allMessages = [sysMsg, ...messages.map(m => ({ role: m.role, content: m.content }))];
    
    const payload = {
      model: 'openrouter/free',
      messages: allMessages,
      temperature: 0.7,
      max_tokens: 1000
    };
    
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + state.openrouterKey,
        'Content-Type': 'application/json',
        'HTTP-Referer': window.location.href
      },
      body: JSON.stringify(payload)
    });
    
    const data = await res.json();
    
    if (data.error) {
      return { ok: false, text: 'Erreur: ' + (data.error.message || 'Erreur inconnue') };
    }
    
    if (!data.choices || !data.choices[0]) {
      return { ok: false, text: 'Pas de réponse reçue.' };
    }
    
    const text = data.choices[0].message.content;
    return { ok: true, text };
  } catch(e) {
    return { ok: false, text: 'Erreur réseau.' };
  }
}

function makeOrbAvatar() {
  const d = document.createElement('div');
  d.className = 'ai-av';
  d.innerHTML = `<div class="orb-inner" style="animation:hueRev 6s linear infinite"><div class="oc" style="width:12px;height:12px;background:#9e9fef;opacity:0.9;top:20%;left:15%"></div><div class="oc" style="width:10px;height:10px;background:#c471ec;opacity:0.85;bottom:20%;right:15%"></div><div class="oc" style="width:13px;height:13px;background:#9bc761;opacity:0.9;bottom:25%;left:30%"></div></div><div class="orb-shine"></div>`;
  return d;
}

function addUserMsg(text, isVoice = false) {
  welcomeEl.style.display = 'none';
  const el = document.createElement('div');
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  el.style.alignSelf = 'flex-end';
  el.style.alignItems = 'flex-end';
  el.style.gap = '4px';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-user';
  bubble.textContent = text;
  el.appendChild(bubble);
  
  if (isVoice) {
    const sub = document.createElement('div');
    sub.className = 'msg-user-sub';
    sub.textContent = '🎤 Vocal';
    el.appendChild(sub);
  }
  
  msgEl.appendChild(el);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function addAIMsg(text) {
  const row = document.createElement('div');
  row.className = 'msg-ai-row';
  row.appendChild(makeOrbAvatar());
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-ai-bubble';
  bubble.innerHTML = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.gap = '4px';
  wrap.appendChild(bubble);
  
  const rr = document.createElement('div');
  rr.className = 'rating-row';
  rr.innerHTML = `<button class="rate-btn" onclick="speakText(this.parentElement.parentElement.parentElement.querySelector('.msg-ai-bubble').textContent)">🔊 Écouter</button><button class="rate-btn good" onclick="rateMsg(this,'good')">👍</button>`;
  wrap.appendChild(rr);
  
  row.appendChild(wrap);
  msgEl.appendChild(row);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function addSystemMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg-system';
  el.textContent = text;
  msgEl.appendChild(el);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-ai-row';
  row.id = 'typing-row';
  row.appendChild(makeOrbAvatar());
  const bubble = document.createElement('div');
  bubble.className = 'msg-ai-bubble';
  bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  row.appendChild(bubble);
  msgEl.appendChild(row);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function removeTyping() { const t = document.getElementById('typing-row'); if(t) t.remove(); }

function rateMsg(btn, type) {
  const rr = btn.closest('.rating-row');
  if (rr.dataset.rated) return;
  rr.dataset.rated = '1';
  state.totalRatings++;
  if (type === 'good') {
    state.goodRatings++;
    btn.classList.add('rated-good');
    rr.querySelectorAll('.rate-btn.bad').forEach(b => b.style.display='none');
    updateBrain();
  }
  saveState();
  updateStats();
}

function speakText(text) {
  if (state.isSpeaking) return;
  state.isSpeaking = true;
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'fr-FR';
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;
  
  utterance.onend = () => {
    state.isSpeaking = false;
  };
  
  utterance.onerror = () => {
    state.isSpeaking = false;
  };
  
  window.speechSynthesis.speak(utterance);
}

async function extractMemory(userMsg) {
  if (/je m'appelle|mon nom est|j'aime|j'adore|je préfère|mon favori/i.test(userMsg)) {
    const fact = 'Utilisateur : ' + userMsg.slice(0,80);
    if (!state.memory.includes(fact)) state.memory.push(fact);
    if (state.memory.length > 40) state.memory.shift();
    saveState();
    updateBrain();
  }
}

function updateBrain() {
  const total = state.memory.length + state.corrections;
  const pct = Math.min(100, Math.round(total * 2.5));
  brainFill.style.width = pct + '%';
}

function updateStats() {
  document.getElementById('s-turns').textContent = state.turns;
  document.getElementById('s-corrections').textContent = state.corrections;
  const score = state.totalRatings > 0 ? Math.round(state.goodRatings / state.totalRatings * 100) + '%' : '—';
  document.getElementById('s-score').textContent = score;
  document.getElementById('s-mem').textContent = state.memory.length + ' faits';
}

function showStats() {
  const score = state.totalRatings > 0 ? Math.round(state.goodRatings / state.totalRatings * 100) + '%' : 'N/A';
  document.getElementById('stats-detail').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div style="background:var(--surface2);border-radius:8px;padding:12px;text-align:center"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">Échanges</div><div style="font-size:22px;font-weight:600;color:var(--nova)">${state.turns}</div></div>
      <div style="background:var(--surface2);border-radius:8px;padding:12px;text-align:center"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">Corrections</div><div style="font-size:22px;font-weight:600;color:var(--nova)">${state.corrections}</div></div>
      <div style="background:var(--surface2);border-radius:8px;padding:12px;text-align:center"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">Qualité</div><div style="font-size:22px;font-weight:600;color:var(--nova)">${score}</div></div>
      <div style="background:var(--surface2);border-radius:8px;padding:12px;text-align:center"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">Mémoire</div><div style="font-size:22px;font-weight:600;color:var(--nova)">${state.memory.length}</div></div>
    </div>
    ${state.memory.length > 0 ? '<div style="font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500">FAITS MÉMORISÉS</div>' + state.memory.slice(-8).map(m => `<div style="padding:4px 0;border-bottom:0.5px solid var(--border);font-size:12px">• ${m}</div>`).join('') : '<div style="color:var(--text3);font-size:12px;text-align:center;padding:16px">Aucun fait mémorisé.</div>'}
  `;
  document.getElementById('stats-overlay').classList.add('active');
}

function closeStats() { document.getElementById('stats-overlay').classList.remove('active'); }

async function submitVoiceMessage(text) {
  if (!text || state.loading) return;
  
  state.loading = true;
  addUserMsg(text, true);
  state.history.push({ role: 'user', content: text });
  state.turns++;
  addTyping();
  brainStatus.textContent = 'Nova pense...';
  
  const result = await callOpenRouter(state.history);
  removeTyping();
  
  if (result.ok) {
    addAIMsg(result.text);
    state.history.push({ role: 'assistant', content: result.text });
    if (state.history.length > 20) state.history.splice(0, 2);
    extractMemory(text);
    brainStatus.textContent = 'Nova Voice prête — OpenRouter free';
    
    setTimeout(() => {
      speakText(result.text);
    }, 500);
  } else {
    addSystemMsg(result.text);
    brainStatus.textContent = 'Nova Voice prête — OpenRouter free';
  }
  
  updateBrain();
  updateStats();
  state.loading = false;
  msgEl.scrollTop = msgEl.scrollHeight;
}

async function submitMsg() {
  const text = inputEl.value.trim();
  if (!text || state.loading) return;

  state.loading = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addUserMsg(text);
  state.history.push({ role: 'user', content: text });
  state.turns++;
  addTyping();
  brainStatus.textContent = 'Nova réfléchit…';

  const result = await callOpenRouter(state.history);
  removeTyping();

  if (result.ok) {
    addAIMsg(result.text);
    state.history.push({ role: 'assistant', content: result.text });
    if (state.history.length > 20) state.history.splice(0, 2);
    extractMemory(text);
  } else {
    addSystemMsg(result.text);
    state.history.pop();
  }

  updateBrain();
  updateStats();
  state.loading = false;
  sendBtn.disabled = inputEl.value.trim() === '';
  msgEl.scrollTop = msgEl.scrollHeight;
}

function resetChat() {
  state.history = [];
  state.turns = 0;
  msgEl.innerHTML = '';
  msgEl.appendChild(welcomeEl);
  welcomeEl.style.display = 'flex';
  window.speechSynthesis.cancel();
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  updateStats();
  brainStatus.textContent = state.memory.length > 0
    ? `Mémoire chargée — ${state.memory.length} fait(s)`
    : 'Nova Voice prête — OpenRouter free';
}

loadState();
updateStats();
</script>
</body>
</html>
